# 图片预算守卫的插入行。
#
# 本插件不发布任何服务，只挂全局事件（tools/post-execute、
# compaction/summary-error、agent/request-error），所以挂在 profile 根平面即可；
# 不要挪进 preset 的 compaction 组 —— 那里被 `isolate: {compaction: true}` 圈住，
# 只有需要提供 compaction 服务的实现才该进去。
- insert:
    - id: image-budget
      name: 'dsh-image-budget'
      config:
        maxImageBytes: 60000
        mode: compress
        rescueSummary: true
        summaryKeepImageBytes: 150000
        rescueRequest: true
        maxRescuesPerStep: 2
        dryRun: false
